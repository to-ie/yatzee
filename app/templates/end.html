{% extends "base.html" %}

{% block content %}

<div class="score-table">
	<div class='header'>
		<div class="player">
			<h3>FINAL SCORE</h3>
		</div>
	</div>

	<div class="break"></div>
	{% for player in players %}
	{% set is_winner = winnerscore > 0 and player.total == winnerscore %}
	<div class="final-row {{ 'final-row-dark' if loop.index is odd else 'final-row-light' }}{% if is_winner %} winner{% endif %}">
		<p class="final-name">{% if is_winner %}🏆 {% endif %}{{ player.name }}</p>
		<p class="final-score">{{ player.total }} points</p>
	</div>
	{% endfor %}

	<a href="{{ url_for('index') }}" class="actionbutton">
	    <div class="actionbuttondiv">Back to home page</div>
	</a>

{% endblock %}
