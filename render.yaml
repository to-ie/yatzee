# Render Blueprint — deploys the app + a managed Postgres database.
# In Render: New > Blueprint, point it at this repo, and it reads this file.
#
# Free-plan notes:
#  - No pre-deploy command on free, so migrations run in startCommand on boot.
#  - The web service spins down after ~15 min idle (first request is slow).
#  - A free Postgres database is deleted ~90 days after creation — back it up
#    or upgrade the database to a paid plan to keep data long-term.

databases:
  - name: yahtzee-db
    plan: free

services:
  - type: web
    name: yahtzee
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Apply migrations on each boot (idempotent), then serve via gunicorn.
    startCommand: flask db upgrade && gunicorn yatzee:app --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_APP
        value: yatzee.py
      - key: SECRET_KEY
        generateValue: true          # Render generates a stable random value
      - key: DATABASE_URL
        fromDatabase:
          name: yahtzee-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"
